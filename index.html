document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

kground:#eef1f5;font-family:'Libre Franklin',system-ui,sans-serif;color:#16243d;padding-bottom:48px;\">\n\n  <!-- HEADER -->\n  <header style=\"background:#16243d;color:#fff;padding:30px 40px 26px;\">\n    <div style=\"max-width:1340px;margin:0 auto;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;justify-content:space-between;\">\n      <div style=\"max-width:760px;\">\n        <div style=\"font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:#8fa6c8;font-weight:600;margin-bottom:10px;\">Cuenta satélite del Trabajo No Remunerado de los Hogares de México · Cifras 2024<\u002Fdiv>\n        <h1 style=\"font-family:'Spectral',serif;font-weight:700;font-size:31px;line-height:1.15;margin:0 0 10px;letter-spacing:-.01em;\">Valoración económica del Trabajo No Remunerado de los Hogares<\u002Fh1>\n        <p style=\"margin:0 0 8px;font-size:14.5px;line-height:1.5;color:#c4d0e2;\">Para cada actividad, elige la ocupación (SINCO) y la actividad económica (SCIAN) que la representen, en el método de valoración: <strong style=\"color:#fff;font-weight:600;\">Función Individual Equivalente (FIE)<\u002Fstrong> e <strong style=\"color:#fff;font-weight:600;\">Híbrido<\u002Fstrong>.<\u002Fp>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:#c4d0e2;\">Observa la valoración económica anual resultante en cifras netas y brutas.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;\">\n        <span style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8fa6c8;font-weight:600;\">1 · Selecciona el método<\u002Fspan>\n        <div style=\"display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:4px;gap:4px;\">\n          <button sc-camel-on-click=\"{{ setFIE }}\" style=\"{{ fieBtnStyle }}\">FIE<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ setHib }}\" style=\"{{ hibBtnStyle }}\">HÍBRIDO<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- LUIS PROFILE -->\n  <div style=\"background:#21344f;color:#fff;padding:18px 40px;\">\n    <div style=\"max-width:1340px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:28px;\">\n      <div style=\"display:flex;align-items:center;gap:14px;\">\n        <div style=\"width:46px;height:46px;border-radius:50%;background:var(--accent,#1f5fa8);display:flex;align-items:center;justify-content:center;flex-shrink:0;\">\n          <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"1\" x2=\"12\" y2=\"23\"><\u002Fline><path d=\"M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8fa6c8;font-weight:600;\">Ejemplo<\u002Fdiv>\n          <div style=\"font-size:16px;font-weight:700;line-height:1.2;\">Luis Alberto<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#b9c6dc;\">Analista en finanzas<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:1px;height:42px;background:rgba(255,255,255,.14);\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:5px;\">\n        <span style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8fa6c8;font-weight:600;\">Ingreso por hora de Luis<\u002Fspan>\n        <div style=\"display:flex;align-items:baseline;gap:3px;\"><span style=\"font-family:'Spectral',serif;font-weight:700;font-size:16px;\">$<\u002Fspan><span style=\"font-family:'Spectral',serif;font-weight:700;font-size:22px;\">{{ wageFmt }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:1px;height:42px;background:rgba(255,255,255,.14);\"><\u002Fdiv>\n      <div>\n        <span style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8fa6c8;font-weight:600;\">Total de horas de TNRH<\u002Fspan>\n        <div style=\"font-family:'Spectral',serif;font-weight:700;font-size:22px;margin-top:3px;\">{{ totalSemanalFmt }} <span style=\"font-size:13px;font-weight:400;color:#b9c6dc;\">/ semana · {{ totalHorasAnioFmt }} / año<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      \n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- LIMIT ERROR -->\n  <sc-if value=\"{{ limiteExcedido }}\" hint-placeholder-val=\"\">\n    <div style=\"background:#b3261e;color:#fff;padding:13px 40px;\">\n      <div style=\"max-width:1340px;margin:0 auto;display:flex;align-items:center;gap:12px;font-size:13.5px;line-height:1.45;font-weight:600;\">\n        <span style=\"flex-shrink:0;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;\">!<\u002Fspan>\n        <span>{{ errorLimite }} ({{ totalSemanalFmt }} horas por semana; las horas no deben de exceder a 112 por semana.)<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- METHOD NOTE -->\n  <div style=\"background:#1f2f4d;color:#cdd9ec;padding:13px 40px;border-top:1px solid rgba(255,255,255,.08);\">\n    <div style=\"max-width:1340px;margin:0 auto;display:flex;align-items:center;gap:12px;font-size:13.5px;line-height:1.45;\">\n      <span style=\"flex-shrink:0;width:22px;height:22px;border-radius:50%;background:{{ methodDotColor }};color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;\">2<\u002Fspan>\n      <span>{{ methodNote }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <main style=\"max-width:1340px;margin:0 auto;padding:28px 40px 0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px;align-items:start;\">\n\n    <!-- ACTIVITIES -->\n    <section style=\"display:flex;flex-direction:column;gap:16px;\">\n      <sc-for list=\"{{ activities }}\" as=\"act\" hint-placeholder-count=\"5\">\n        <article style=\"background:#fff;border:1px solid #e2e7ef;border-radius:14px;padding:20px 22px;box-shadow:0 1px 2px rgba(22,36,61,.04);\">\n          <!-- card header -->\n          <div style=\"display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;\">\n            <div style=\"flex-shrink:0;width:34px;height:34px;border-radius:9px;background:#16243d;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Spectral',serif;font-weight:700;font-size:17px;\">{{ act.num }}<\u002Fdiv>\n            <div style=\"flex:1;min-width:0;\">\n              <h3 style=\"margin:0;font-size:17px;font-weight:700;line-height:1.25;\">{{ act.name }}<\u002Fh3>\n              <sc-if value=\"{{ act.sub }}\" hint-placeholder-val=\"\">\n                <p style=\"margin:3px 0 0;font-size:12.5px;color:#6b7890;line-height:1.4;\">{{ act.sub }}<\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"{{ act.badgeStyle }}\">{{ act.badgeLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- weekly time worked -->\n          <div style=\"display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;padding:13px 15px;background:#f4f6fa;border:1px solid #e2e7ef;border-radius:11px;\">\n            <div style=\"flex:1;\">\n              <div style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#42526b;\">Tiempo dedicado por semana<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8a99b3;margin-top:2px;\">Equivale a <strong style=\"color:#42526b;font-weight:600;\">{{ act.horasAnioFmt }}<\u002Fstrong> horas al año.<\u002Fdiv>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:5px;width:84px;\">\n              <span style=\"font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:#6b7890;text-align:center;\">Horas<\u002Fspan>\n              <input class=\"scl-num\" type=\"number\" min=\"0\" step=\"1\" value=\"{{ act.horas }}\" sc-camel-on-input=\"{{ act.onHoras }}\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:5px;width:84px;\">\n              <span style=\"font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:#6b7890;text-align:center;\">Minutos<\u002Fspan>\n              <input class=\"scl-num\" type=\"number\" min=\"0\" max=\"59\" step=\"1\" value=\"{{ act.minutos }}\" sc-camel-on-input=\"{{ act.onMinutos }}\">\n            <\u002Flabel>\n          <\u002Fdiv>\n\n          <!-- two valuation columns -->\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;\">\n\n            <!-- NETO / SINCO -->\n            <div style=\"border:1px solid #e7ebf2;border-radius:11px;padding:14px;background:#fafbfd;\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\">\n                <span style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent,#1f5fa8);\">Valor neto<\u002Fspan>\n                <span style=\"font-size:10.5px;font-weight:600;color:#6b7890;background:#eef2f8;padding:3px 8px;border-radius:5px;\">Ocupación · SINCO<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"position:relative;\">\n                <sc-raw-select class=\"scl-sel\" value=\"{{ act.netoSel }}\" sc-camel-on-change=\"{{ act.onNeto }}\">\n                  <option value=\"\">— Selecciona ocupación —<\u002Foption>\n                  <sc-for list=\"{{ sincoOpts }}\" as=\"o\" hint-placeholder-count=\"0\"><option value=\"{{ o.code }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n                <span style=\"position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:#8a99b3;font-size:11px;\">▼<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-top:12px;gap:8px;\">\n                <div style=\"{{ act.netoStyle }}\">{{ act.netoFmt }}<\u002Fdiv>\n                <span style=\"font-size:11px;color:#8a99b3;\">por hora<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:11px;color:#6b7890;margin-top:3px;\">Reemplazo neto anual: <strong style=\"color:var(--accent,#1f5fa8);font-weight:700;\">{{ act.netoAnioFmt }}<\u002Fstrong><\u002Fdiv>\n              <div style=\"{{ act.netoStatusStyle }}\">{{ act.netoStatusLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- BRUTO / SCIAN -->\n            <div style=\"border:1px solid #ece6dc;border-radius:11px;padding:14px;background:#fdfbf7;\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\">\n                <span style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#a96a1b;\">Valor bruto<\u002Fspan>\n                <span style=\"font-size:10.5px;font-weight:600;color:#8a7350;background:#f4ece0;padding:3px 8px;border-radius:5px;\">Act. económica · SCIAN<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"position:relative;\">\n                <sc-raw-select class=\"scl-sel\" value=\"{{ act.brutoSel }}\" sc-camel-on-change=\"{{ act.onBruto }}\">\n                  <option value=\"\">— Selecciona actividad económica —<\u002Foption>\n                  <sc-for list=\"{{ scianOpts }}\" as=\"o\" hint-placeholder-count=\"0\"><option value=\"{{ o.code }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n                <span style=\"position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:#b89a6e;font-size:11px;\">▼<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-top:12px;gap:8px;\">\n                <div style=\"{{ act.brutoStyle }}\">{{ act.brutoFmt }}<\u002Fdiv>\n                <span style=\"font-size:11px;color:#b89a6e;\">por hora<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a7350;margin-top:3px;\">Reemplazo bruto anual: <strong style=\"color:#a96a1b;font-weight:700;\">{{ act.brutoAnioFmt }}<\u002Fstrong><\u002Fdiv>\n              <div style=\"{{ act.brutoStatusStyle }}\">{{ act.brutoStatusLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n    <!-- SUMMARY SIDEBAR -->\n    <aside style=\"position:sticky;top:18px;display:flex;flex-direction:column;gap:16px;\">\n\n      <!-- ANNUAL VALUATION -->\n      <div style=\"background:#fff;border:1px solid #e2e7ef;border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(22,36,61,.04);\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;\">\n          <h4 style=\"margin:0;font-size:15px;font-weight:700;\">Valoración económica anual<\u002Fh4>\n          <span style=\"{{ methodTagStyle }}\">{{ methodTag }}<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 16px;font-size:11.5px;line-height:1.4;color:#8a99b3;\">Estimación del valor del TNRH de Luis al año (pesos).<\u002Fp>\n\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <!-- oportunidad -->\n          <div style=\"border:1px solid #e3e8f0;border-radius:11px;padding:14px;background:linear-gradient(180deg,#fbfcfe,#f6f8fc);\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n              <span style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:#42526b;\">Costo de oportunidad<\u002Fspan>\n              <span style=\"font-size:10px;color:#8a99b3;\">salario de Luis<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-family:'Spectral',serif;font-weight:700;font-size:26px;color:#16243d;margin-top:5px;letter-spacing:-.01em;\">{{ oportunidadFmt }}<\u002Fdiv>\n          <\u002Fdiv>\n          <!-- reemplazo neto -->\n          <div style=\"border:1px solid #e0e8f2;border-radius:11px;padding:14px;background:#f7fafd;\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n              <span style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--accent,#1f5fa8);\">Costo de reemplazo · neto<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-family:'Spectral',serif;font-weight:700;font-size:26px;color:#16243d;margin-top:5px;letter-spacing:-.01em;\">{{ reempNetoFmt }}<\u002Fdiv>\n          <\u002Fdiv>\n          <!-- reemplazo bruto -->\n          <div style=\"border:1px solid #ece2d2;border-radius:11px;padding:14px;background:#fdfbf7;\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n              <span style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:#a96a1b;\">Costo de reemplazo · bruto<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-family:'Spectral',serif;font-weight:700;font-size:26px;color:#16243d;margin-top:5px;letter-spacing:-.01em;\">{{ reempBrutoFmt }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:18px;display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;\">\n          <span style=\"font-size:12.5px;font-weight:600;color:#42526b;\">Actividades valoradas correctamente<\u002Fspan>\n          <span style=\"font-size:13px;font-weight:700;\"><span style=\"color:{{ methodDotColor }};\">{{ score }}<\u002Fspan> / 5<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:9px;background:#e9edf3;border-radius:6px;overflow:hidden;\">\n          <div style=\"{{ progressStyle }}\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ reset }}\" style=\"margin-top:15px;width:100%;border:1.5px solid #d3dae5;background:#fff;color:#42526b;font-family:inherit;font-weight:600;font-size:12.5px;padding:9px;border-radius:8px;cursor:pointer;\" style-hover=\"border-color:#9fb2cc;background:#fafbfd;\">Reiniciar {{ methodTag }}<\u002Fbutton>\n      <\u002Fdiv>\n\n    <\u002Faside>\n  <\u002Fmain>\n\n  <!-- ANNUAL BREAKDOWN TABLE -->\n  <section style=\"max-width:1340px;margin:26px auto 0;padding:0 40px;\">\n    <div style=\"background:#fff;border:1px solid #e2e7ef;border-radius:14px;padding:22px 24px;box-shadow:0 1px 2px rgba(22,36,61,.04);\">\n      <h4 style=\"margin:0 0 3px;font-size:16px;font-weight:700;\">Desglose anual por actividad — {{ methodTag }}<\u002Fh4>\n      <p style=\"margin:0 0 16px;font-size:12.5px;color:#6b7890;\">Valor económico al año (pesos) del trabajo no remunerado de Luis Alberto.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:2fr 1fr 1.1fr 1.1fr 1.1fr;gap:10px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:#8a99b3;padding-bottom:11px;border-bottom:2px solid #eef1f6;\">\n        <span>Actividad<\u002Fspan>\n        <span style=\"text-align:right;\">Horas / año<\u002Fspan>\n        <span style=\"text-align:right;\">Costo de oportunidad<\u002Fspan>\n        <span style=\"text-align:right;\">Reemplazo neto<\u002Fspan>\n        <span style=\"text-align:right;\">Reemplazo bruto<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n        <div style=\"display:grid;grid-template-columns:2fr 1fr 1.1fr 1.1fr 1.1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #f0f3f7;\">\n          <span style=\"font-size:13.5px;font-weight:600;color:#16243d;\">{{ r.name }}<\u002Fspan>\n          <span style=\"text-align:right;font-size:13px;color:#42526b;font-variant-numeric:tabular-nums;\">{{ r.horasAnio }}<\u002Fspan>\n          <span style=\"text-align:right;font-family:'Spectral',serif;font-weight:700;font-size:15px;color:#16243d;\">{{ r.oport }}<\u002Fspan>\n          <span style=\"text-align:right;font-family:'Spectral',serif;font-weight:700;font-size:15px;color:var(--accent,#1f5fa8);\">{{ r.neto }}<\u002Fspan>\n          <span style=\"text-align:right;font-family:'Spectral',serif;font-weight:700;font-size:15px;color:#a96a1b;\">{{ r.bruto }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"display:grid;grid-template-columns:2fr 1fr 1.1fr 1.1fr 1.1fr;gap:10px;align-items:center;padding:15px 0 4px;\">\n        <span style=\"font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#16243d;\">Total<\u002Fspan>\n        <span style=\"text-align:right;font-size:13px;font-weight:700;color:#42526b;font-variant-numeric:tabular-nums;\">{{ totalHorasAnioFmt }}<\u002Fspan>\n        <span style=\"text-align:right;font-family:'Spectral',serif;font-weight:700;font-size:18px;color:#16243d;\">{{ oportunidadFmt }}<\u002Fspan>\n        <span style=\"text-align:right;font-family:'Spectral',serif;font-weight:700;font-size:18px;color:var(--accent,#1f5fa8);\">{{ reempNetoFmt }}<\u002Fspan>\n        <span style=\"text-align:right;font-family:'Spectral',serif;font-weight:700;font-size:18px;color:#a96a1b;\">{{ reempBrutoFmt }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 1340, &quot;height&quot;: 1720 },\n  &quot;accent&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#1f5fa8&quot; },\n  &quot;mostrarComparativa&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true }\n}\">\nclass Component extends DCLogic {\n  state = {\n    method: 'FIE',\n    sel: {},\n    wage: 125.40814613411021,\n    time: {\n      1: { h: 14, m: 30 },\n      2: { h: 3, m: 15 },\n      3: { h: 8, m: 20 },\n      4: { h: 1, m: 0 },\n      5: { h: 10, m: 45 },\n    },\n  };\n\n  SEMANAS = 52;\n\n  // SINCO — ocupaciones, costo por hora NETO (2024)\n  sinco() {\n    return [\n      { code: '2121', name: 'Contadores y auditores', cost: 88.580643662523613 },\n      { code: '2411', name: 'Médicos generales y familiares', cost: 110.66053124136235 },\n      { code: '2512', name: 'Auxiliares en contabilidad, finanzas y agentes de bolsa', cost: 57.060011966152842 },\n      { code: '2541', name: 'Diseñadores de moda y vestuario', cost: 88.910423466818798 },\n      { code: '2811', name: 'Enfermeras (técnicas)', cost: 65.909297671649 },\n      { code: '5101', name: 'Chefs', cost: 54.771096483201838 },\n      { code: '5111', name: 'Cocineros', cost: 45.466768860926585 },\n      { code: '7341', name: 'Sastres y modistos, costureras y confeccionadores', cost: 33.587653871061789 },\n      { code: '9601', name: 'Supervisores en limpieza, amas de llaves y mayordomos', cost: 45.680731463482857 },\n      { code: '9611', name: 'Trabajadores domésticos', cost: 41.639596531944676 },\n      { code: '9621', name: 'Barrenderos y trabajadores de limpieza', cost: 41.90973718254854 },\n    ];\n  }\n  // SCIAN — actividades económicas, costo por hora BRUTO (2024)\n  scian() {\n    return [\n      { code: '3151', name: 'Fabricación de prendas de vestir de tejido de punto', cost: 71.574300725193808 },\n      { code: '315225', name: 'Confección de prendas de vestir sobre medida', cost: 45.204935920076096 },\n      { code: '541211', name: 'Servicios de contabilidad y auditoría', cost: 242.9395940154954 },\n      { code: '561110', name: 'Servicios de administración de negocios', cost: 154.49525772951122 },\n      { code: '561720', name: 'Servicios de limpieza de inmuebles', cost: 56.312693724387188 },\n      { code: '621610', name: 'Servicios de enfermería a domicilio', cost: 80.796500472682865 },\n      { code: '6221', name: 'Hospitales generales del sector privado', cost: 112.07796598804215 },\n      { code: '7225', name: 'Servicios de preparación de alimentos y bebidas', cost: 46.592250948952632 },\n      { code: '814110', name: 'Hogares con empleados domésticos', cost: 44.405631203911447 },\n    ];\n  }\n  // Actividades con respuesta correcta por método (neto SINCO / bruto SCIAN)\n  acts() {\n    return [\n      { id: 1, num: '1', name: 'Cocinar', sub: '',\n        fie: { neto: '5111', bruto: '7225' }, hib: { neto: '9611', bruto: '814110' },\n        why: 'En FIE, cocinar corresponde a cocineros (5111) y a la preparación de alimentos (7225). En el método híbrido se valora con trabajadora doméstica (9611 · 814110).' },\n      { id: 2, num: '2', name: 'Arreglar o reparar ropa', sub: '',\n        fie: { neto: '7341', bruto: '315225' }, hib: { neto: '7341', bruto: '315225' },\n        why: 'Reparar ropa equivale al oficio de sastre/modista (7341) y a la confección de prendas de vestir sobre medida (315225), en ambos métodos.' },\n      { id: 3, num: '3', name: 'Cuidados especializados', sub: 'Personas con enfermedad crónica y/o discapacidad',\n        fie: { neto: '2811', bruto: '621610' }, hib: { neto: '2811', bruto: '621610' },\n        why: 'Por su complejidad, los cuidados se valoran con enfermería técnica (2811) y servicios de enfermería a domicilio (621610) en ambos métodos.' },\n      { id: 4, num: '4', name: 'Pagos, trámites y organizar quehaceres', sub: '',\n        fie: { neto: '2512', bruto: '561110' }, hib: { neto: '2512', bruto: '561110' },\n        why: 'Pagos y trámites equivalen a labores auxiliares de contabilidad (2512) y servicios de administración de negocios (561110), en ambos métodos.' },\n      { id: 5, num: '5', name: 'Limpieza interior de la vivienda', sub: '',\n        fie: { neto: '9621', bruto: '561720' }, hib: { neto: '9611', bruto: '814110' },\n        why: 'En FIE, la limpieza se valora con trabajadores de limpieza (9621) y servicios de limpieza (561720). En el híbrido se valora con trabajadora doméstica (9611 · 814110).' },\n    ];\n  }\n\n  setFIE = () => this.setState({ method: 'FIE' });\n  setHib = () => this.setState({ method: 'HIBRIDO' });\n  onWage = (e) => { let w = parseFloat(e.target.value); if (isNaN(w) || w < 0) w = 0; this.setState({ wage: w }); };\n  reset = () => this.setState(s => {\n    const m = s.method;\n    const sel = {};\n    Object.keys(s.sel).forEach(id => { const o = { ...s.sel[id] }; delete o[m]; sel[id] = o; });\n    return { sel };\n  });\n  setTime(id, field, val) {\n    let n = parseInt(val, 10);\n    if (isNaN(n) || n < 0) n = 0;\n    if (field === 'm' && n > 59) n = 59;\n    this.setState(s => {\n      const time = { ...s.time };\n      time[id] = { ...(time[id] || { h: 0, m: 0 }), [field]: n };\n      return { time };\n    });\n  }\n  pick(id, field, val) {\n    this.setState(s => {\n      const m = s.method;\n      const sel = { ...s.sel };\n      const forAct = { ...(sel[id] || {}) };\n      forAct[m] = { ...(forAct[m] || {}), [field]: val };\n      sel[id] = forAct;\n      return { sel };\n    });\n  }\n\n  renderVals() {\n    const isHib = this.state.method === 'HIBRIDO';\n    const m = this.state.method;\n    const sel = this.state.sel;\n    const wage = this.state.wage;\n    const timeState = this.state.time || {};\n    const sincoAll = this.sinco();\n    const scianAll = this.scian();\n    const findS = c => sincoAll.find(o => o.code === c);\n    const findC = c => scianAll.find(o => o.code === c);\n\n    const fmtHr = n => (n == null ? '—' : '$' + n.toFixed(2));\n    const fmtYr = n => (n == null ? '—' : '$' + Math.round(n).toLocaleString('es-MX'));\n    const fmtH = n => n.toLocaleString('es-MX', { minimumFractionDigits: 0, maximumFractionDigits: 1 });\n\n    const NETO = 'var(--accent, #1f5fa8)';\n    const BRUTO = '#a96a1b';\n    const GREEN = '#2e7d57';\n    const WARN = '#b06b39';\n    const MUTE = '#9aa6ba';\n    const ACCENT = this.props.accent ?? '#1f5fa8';\n    const HIBCOLOR = '#c98a3a';\n    const methodColor = isHib ? HIBCOLOR : ACCENT;\n\n    const figBase = { fontFamily: \"'Spectral',serif\", fontWeight: 700, fontSize: '25px', letterSpacing: '-.01em' };\n    const statusBase = { marginTop: '7px', fontSize: '12px', fontWeight: 600, minHeight: '16px' };\n    const badgeBase = { flexShrink: 0, fontSize: '12px', fontWeight: 700, padding: '6px 12px', borderRadius: '20px' };\n\n    let oportunidad = 0, reempNeto = 0, reempBruto = 0, totalHoras = 0, score = 0, totalSemanal = 0;\n    const rows = [];\n\n    const activities = this.acts().map(a => {\n      const t = timeState[a.id] || { h: 0, m: 0 };\n      const horasSem = t.h + t.m / 60;\n      const horasAnio = horasSem * this.SEMANAS;\n      totalSemanal += horasSem;\n      totalHoras += horasAnio;\n\n      const correct = isHib ? a.hib : a.fie;\n      const cur = (sel[a.id] && sel[a.id][m]) || {};\n      const netoSel = cur.neto || '';\n      const brutoSel = cur.bruto || '';\n      const nO = netoSel ? findS(netoSel) : null;\n      const bO = brutoSel ? findC(brutoSel) : null;\n\n      const netoAnio = nO ? horasAnio * nO.cost : 0;\n      const brutoAnio = bO ? horasAnio * bO.cost : 0;\n      const oportAnio = horasAnio * wage;\n      oportunidad += oportAnio;\n      reempNeto += netoAnio;\n      reempBruto += brutoAnio;\n\n      const netoOk = netoSel === correct.neto;\n      const brutoOk = brutoSel === correct.bruto;\n      if (netoOk && brutoOk) score++;\n\n      let badgeLabel, badgeBg, badgeFg;\n      if (!netoSel && !brutoSel) { badgeLabel = 'Pendiente'; badgeBg = '#eef2f8'; badgeFg = '#8a99b3'; }\n      else if (netoOk && brutoOk) { badgeLabel = 'Valorada'; badgeBg = '#e4f3ea'; badgeFg = '#2e7d57'; }\n      else { badgeLabel = 'En progreso'; badgeBg = '#fbf3e8'; badgeFg = '#a96a1b'; }\n\n      let netoStatus = '', netoStatusColor = MUTE;\n      if (netoSel) { netoStatus = netoOk ? '✓ Ocupación adecuada' : '✗ No es la más adecuada'; netoStatusColor = netoOk ? GREEN : WARN; }\n      let brutoStatus = '', brutoStatusColor = MUTE;\n      if (brutoSel) { brutoStatus = brutoOk ? '✓ Actividad adecuada' : '✗ No es la más adecuada'; brutoStatusColor = brutoOk ? GREEN : WARN; }\n\n      rows.push({\n        name: a.num + '. ' + a.name,\n        horasAnio: fmtH(horasAnio),\n        oport: fmtYr(oportAnio),\n        neto: nO ? fmtYr(netoAnio) : '—',\n        bruto: bO ? fmtYr(brutoAnio) : '—',\n      });\n\n      return {\n        id: a.id, num: a.num, name: a.name, sub: a.sub,\n        horas: t.h, minutos: t.m, horasAnioFmt: fmtH(horasAnio),\n        onHoras: e => this.setTime(a.id, 'h', e.target.value),\n        onMinutos: e => this.setTime(a.id, 'm', e.target.value),\n        netoSel, brutoSel,\n        onNeto: e => this.pick(a.id, 'neto', e.target.value),\n        onBruto: e => this.pick(a.id, 'bruto', e.target.value),\n        netoFmt: fmtHr(nO ? nO.cost : null), brutoFmt: fmtHr(bO ? bO.cost : null),\n        netoAnioFmt: nO ? fmtYr(netoAnio) : '—', brutoAnioFmt: bO ? fmtYr(brutoAnio) : '—',\n        netoStyle: { ...figBase, color: nO ? NETO : MUTE },\n        brutoStyle: { ...figBase, color: bO ? BRUTO : MUTE },\n        netoStatusLabel: netoStatus, netoStatusStyle: { ...statusBase, color: netoStatusColor },\n        brutoStatusLabel: brutoStatus, brutoStatusStyle: { ...statusBase, color: brutoStatusColor },\n        badgeLabel, badgeStyle: { ...badgeBase, background: badgeBg, color: badgeFg },\n        hintShow: (netoSel && brutoSel) ? '1' : '', hintText: a.why,\n      };\n    });\n\n    // óptimos anuales por método\n    const optTotals = (key) => {\n      let n = 0, b = 0;\n      this.acts().forEach(a => {\n        const t = timeState[a.id] || { h: 0, m: 0 };\n        const ha = (t.h + t.m / 60) * this.SEMANAS;\n        n += ha * findS(a[key].neto).cost;\n        b += ha * findC(a[key].bruto).cost;\n      });\n      return { n, b };\n    };\n    const fieOpt = optTotals('fie');\n    const hibOpt = optTotals('hib');\n\n    const sincoOpts = sincoAll.map(o => ({ code: o.code, label: o.code + '  ·  ' + o.name }));\n    const scianOpts = scianAll.map(o => ({ code: o.code, label: o.code + '  ·  ' + o.name }));\n    const btnBase = { border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontWeight: 700, fontSize: '13px', letterSpacing: '.04em', padding: '9px 20px', borderRadius: '7px', transition: 'all .15s' };\n    const btnActive = { background: '#ffffff', color: '#16243d', boxShadow: '0 1px 3px rgba(0,0,0,.18)' };\n    const btnIdle = { background: 'transparent', color: 'rgba(255,255,255,.65)' };\n\n    return {\n      accent: ACCENT,\n      accentSoft: 'rgba(31,95,168,.16)',\n      mostrarComparativa: this.props.mostrarComparativa ?? true,\n      sincoOpts, scianOpts, activities, rows, reset: this.reset,\n      setFIE: this.setFIE, setHib: this.setHib,\n      wage: wage, wageFmt: wage.toFixed(2), onWage: this.onWage,\n      fieBtnStyle: { ...btnBase, ...(isHib ? btnIdle : btnActive) },\n      hibBtnStyle: { ...btnBase, ...(isHib ? btnActive : btnIdle) },\n      methodTag: isHib ? 'Híbrido' : 'FIE',\n      methodDotColor: methodColor,\n      methodTagStyle: {\n        fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.08em', padding: '4px 10px', borderRadius: '20px',\n        background: isHib ? 'rgba(201,138,58,.16)' : 'var(--accentSoft,rgba(31,95,168,.16))',\n        color: isHib ? '#a96a1b' : 'var(--accent,#1f5fa8)',\n      },\n      methodNote: 'Para cada actividad elige la ocupación (SINCO) y la actividad económica (SCIAN) que mejor representan la tarea realizada.',\n      limiteExcedido: totalSemanal > 112 ? '1' : '',\n      totalSemanalFmt: fmtH(totalSemanal),\n      errorLimite: 'ERROR: dedica más horas al TNRH de las posibles. Revisar datos.',\n      totalHorasAnioFmt: fmtH(totalHoras),\n      oportunidadFmt: fmtYr(oportunidad),\n      reempNetoFmt: fmtYr(reempNeto),\n      reempBrutoFmt: fmtYr(reempBruto),\n      score,\n      progressStyle: { height: '100%', background: methodColor, borderRadius: '6px', transition: 'width .35s ease', width: (score / 5 * 100) + '%' },\n      fieOptNetoFmt: fmtYr(fieOpt.n), fieOptBrutoFmt: fmtYr(fieOpt.b),\n      hibOptNetoFmt: fmtYr(hibOpt.n), hibOptBrutoFmt: fmtYr(hibOpt.b),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
